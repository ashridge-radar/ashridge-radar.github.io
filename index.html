var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(B.i)},key,u(B.c));if(remember)localStorage.setItem('cr-pw',pw);
document.open();document.write(new TextDecoder().decode(pt));document.close();}
document.getElementById('f').onsubmit=function(ev){ev.preventDefault();document.getElementById('e').textContent='Unlocking…';
go(document.getElementById('p').value,document.getElementById('r').checked).catch(function(){document.getElementById('e').textContent='Wrong passphrase'})};
var s=localStorage.getItem('cr-pw');if(s)go(s).catch(function(){localStorage.removeItem('cr-pw')});
</script></body></html>
